<main class="page-shell">
  <div class="page-header">
    <h2 class="page-title"><i class="fas fa-edit" aria-hidden="true"></i> Modifier le livre</h2>
    <p class="page-subtitle">Mettez à jour les informations de cet ouvrage.</p>
  </div>

  <section class="form-card">
    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="bookName"><i class="fas fa-book" aria-hidden="true"></i> Nom du livre</label>
          <input type="text" class="form-control" id="bookName" [(ngModel)]="book.bookName" name="bookName">
        </div>
        <div class="form-group">
          <label class="form-label" for="bookAuthor"><i class="fas fa-pen" aria-hidden="true"></i> Auteur</label>
          <input type="text" class="form-control" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor">
        </div>
        <div class="form-group">
          <label class="form-label" for="bookGenre"><i class="fas fa-tags" aria-hidden="true"></i> Genre</label>
          <input type="text" class="form-control" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre">
        </div>
        <div class="form-group">
          <label class="form-label" for="noOfCopies"><i class="fas fa-copy" aria-hidden="true"></i> Nombre de copies</label>
          <input type="number" min="0" class="form-control" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies">
        </div>
      </div>

      <div class="form-actions">
        <a class="btn btn-outline" routerLink="/books"><i class="fas fa-arrow-left" aria-hidden="true"></i> Annuler</a>
        <button class="btn btn-primary" type="submit"><i class="fas fa-save" aria-hidden="true"></i> Mettre à jour</button>
      </div>
    </form>
  </section>
</main>
