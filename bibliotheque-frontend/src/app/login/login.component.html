<div class="login-wrapper">
  <div class="login-card card">
    <div class="login-header">
      <i class="fas fa-book-open login-logo" aria-hidden="true"></i>
      <h2 class="login-title">Connexion</h2>
      <p class="login-subtitle">Accédez à votre espace bibliothèque.</p>
    </div>

    <form autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
      <div class="form-group mb-3">
        <label class="form-label" for="loginUsername">
          <i class="fas fa-user" aria-hidden="true"></i> Nom d'utilisateur
        </label>
        <input
          type="text"
          name="username"
          ngModel
          required
          #username="ngModel"
          class="form-control"
          [class.is-invalid]="username.invalid && username.touched"
          id="loginUsername"
          placeholder="Entrez votre nom d'utilisateur">
        <div *ngIf="username.invalid && username.touched" class="invalid-feedback">
          <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
          Le nom d'utilisateur est obligatoire.
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="loginPassword">
          <i class="fas fa-lock" aria-hidden="true"></i> Mot de passe
        </label>
        <input
          type="password"
          name="password"
          ngModel
          required
          #password="ngModel"
          class="form-control"
          [class.is-invalid]="password.invalid && password.touched"
          id="loginPassword"
          placeholder="Entrez votre mot de passe">
        <div *ngIf="password.invalid && password.touched" class="invalid-feedback">
          <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
          Le mot de passe est obligatoire.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger mb-3">
        <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-100 login-btn" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span *ngIf="!loading"><i class="fas fa-sign-in-alt" aria-hidden="true"></i> Se connecter</span>
        <span *ngIf="loading">Connexion...</span>
      </button>
    </form>
  </div>
</div>
