<main class="page-shell">
  <div class="page-header">
    <h2 class="page-title"><i class="fas fa-book" aria-hidden="true"></i> Liste des livres</h2>
    <p class="page-subtitle">Consultez, modifiez et supprimez les ouvrages disponibles.</p>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner-border text-primary" role="status"></div>
    <span>Chargement des livres...</span>
  </div>

  <div *ngIf="!loading && error" class="alert alert-danger d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
    <span><i class="fas fa-exclamation-circle" aria-hidden="true"></i> {{ error }}</span>
    <button class="btn btn-danger btn-sm" type="button" (click)="getBooks()">Réessayer</button>
  </div>

  <div *ngIf="!loading && !error && books.length === 0" class="empty-state">
    <i class="fas fa-book-open empty-icon" aria-hidden="true"></i>
    <strong>Aucun livre trouvé.</strong>
    <a class="btn btn-primary mt-2" routerLink="/books/create">Ajouter un livre</a>
  </div>

  <div *ngIf="!loading && !error && books.length > 0" class="table-container">
    <table class="table table-striped responsive-table-card">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Auteur</th>
          <th>Genre</th>
          <th>Copies</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of books">
          <td data-label="ID">{{ book.bookId }}</td>
          <td data-label="Nom">{{ book.bookName }}</td>
          <td data-label="Auteur">{{ book.bookAuthor }}</td>
          <td data-label="Genre">{{ book.bookGenre }}</td>
          <td data-label="Copies"><span class="badge badge-info">{{ book.noOfCopies }}</span></td>
          <td data-label="Actions">
            <div class="action-group">
              <button (click)="bookDetails(book.bookId)" class="btn btn-success btn-sm">
                <i class="fas fa-eye" aria-hidden="true"></i> Voir
              </button>
              <button (click)="updateBook(book.bookId)" class="btn btn-info btn-sm">
                <i class="fas fa-edit" aria-hidden="true"></i> Modifier
              </button>
              <button (click)="deleteBook(book.bookId)" class="btn btn-danger btn-sm">
                <i class="fas fa-trash" aria-hidden="true"></i> Supprimer
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
