<form class="reservation-form card" [formGroup]="reservationForm" (ngSubmit)="submit()">
  <div class="card-header">
    <h5 class="card-title mb-0">
      <i class="fas fa-plus-circle text-primary" aria-hidden="true"></i>
      Nouvelle réservation
    </h5>
  </div>

  <div class="card-body">
    <div class="form-row">
      <div class="form-group">
        <label for="bookId" class="form-label">
          <i class="fas fa-book" aria-hidden="true"></i> Livre
        </label>
        <select
          id="bookId"
          formControlName="bookId"
          class="form-control"
          [class.is-invalid]="reservationForm.get('bookId')?.invalid && reservationForm.get('bookId')?.touched">
          <option value="">-- Sélectionnez un livre --</option>
          <option *ngFor="let book of books" [value]="book.bookId">
            {{ book.bookName }} ({{ book.bookAuthor }})
          </option>
        </select>
        <div *ngIf="reservationForm.get('bookId')?.invalid && reservationForm.get('bookId')?.touched" class="invalid-feedback">
          <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
          Le livre est obligatoire.
        </div>
      </div>

      <div class="form-group">
        <label for="adherentId" class="form-label">
          <i class="fas fa-user" aria-hidden="true"></i> Adhérent
        </label>
        <select
          id="adherentId"
          formControlName="adherentId"
          class="form-control"
          [class.is-invalid]="reservationForm.get('adherentId')?.invalid && reservationForm.get('adherentId')?.touched">
          <option value="">-- Sélectionnez un adhérent --</option>
          <option *ngFor="let user of users" [value]="user.userId">
            {{ user.name }} ({{ user.username }})
          </option>
        </select>
        <div *ngIf="reservationForm.get('adherentId')?.invalid && reservationForm.get('adherentId')?.touched" class="invalid-feedback">
          <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
          L'adhérent est obligatoire.
        </div>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary btn-submit"
          [disabled]="reservationForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          <span *ngIf="!loading"><i class="fas fa-save" aria-hidden="true"></i> Créer</span>
          <span *ngIf="loading">Création...</span>
        </button>
      </div>
    </div>

    <div *ngIf="successMessage" class="alert alert-success mt-3 mb-0">
      <i class="fas fa-check-circle" aria-hidden="true"></i>
      {{ successMessage }}
    </div>

    <div *ngIf="serverError" class="alert alert-danger mt-3 mb-0">
      <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
      {{ serverError }}
    </div>
  </div>
</form>
