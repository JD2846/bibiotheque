server.port=8080

# ===========================
# PostgreSQL (environnement Docker Compose)
# Le service PostgreSQL est accessible via le nom "postgres" du réseau Docker
# ===========================
spring.datasource.url=jdbc:postgresql://postgres:5432/bibliotheque
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===========================
# JPA / Hibernate
# Le schéma est créé par init-scripts/01-init.sql (docker-entrypoint-initdb.d)
# => ddl-auto=none pour ne pas interférer avec le script d'initialisation
# ===========================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# Jackson (sérialisation JSON)
# ===========================
spring.jackson.time-zone=UTC

# ===========================
# Actuator (healthcheck Docker)
# ===========================
management.endpoints.web.exposure.include=health,info
