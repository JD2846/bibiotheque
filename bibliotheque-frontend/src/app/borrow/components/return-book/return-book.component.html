<main class="page-shell">
  <div class="page-header">
    <h2 class="page-title"><i class="fas fa-undo-alt" aria-hidden="true"></i> Rendre un livre</h2>
    <p class="page-subtitle">Suivez vos emprunts en cours et signalez les retours.</p>
  </div>

  <div *ngIf="loading" class="alert alert-info d-flex align-items-center gap-2">
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    Traitement du retour...
  </div>
  <div *ngIf="error" class="alert alert-danger"><i class="fas fa-exclamation-circle" aria-hidden="true"></i> {{ error }}</div>
  <div *ngIf="success" class="alert alert-success"><i class="fas fa-check-circle" aria-hidden="true"></i> {{ success }}</div>
  <div *ngIf="!loading && !error && borrow.length === 0" class="empty-state">
    <i class="fas fa-check-circle empty-icon" aria-hidden="true"></i>
    Aucun emprunt en cours.
  </div>

  <div *ngIf="borrow.length > 0" class="table-container">
    <table class="table table-striped responsive-table-card">
      <thead>
        <tr>
          <th>Livre</th>
          <th>Date emprunt</th>
          <th>Date retour</th>
          <th>Date limite</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of borrow">
          <td data-label="Livre">{{ b.bookId }}</td>
          <td data-label="Date emprunt">{{ b.issueDate }}</td>
          <td data-label="Date retour">{{ b.returnDate || 'Non rendu' }}</td>
          <td data-label="Date limite">{{ b.dueDate }}</td>
          <td data-label="Action">
            <button *ngIf="b.returnDate === null" (click)="returnBook(b.borrowId)" class="btn btn-success btn-sm" [disabled]="loading">
              <i class="fas fa-undo-alt" aria-hidden="true"></i> Rendre
            </button>
            <span *ngIf="b.returnDate !== null" class="text-muted"><i class="fas fa-check" aria-hidden="true"></i> Terminé</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
