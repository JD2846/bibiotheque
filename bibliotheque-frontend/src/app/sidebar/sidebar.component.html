<aside class="app-sidebar" [class.open]="isOpen" [class.collapsed]="collapsed">
  <a class="sidebar-brand" routerLink="/home" [title]="collapsed ? 'Bibliothèque' : ''">
    <i class="fas fa-book-open sidebar-brand-icon" aria-hidden="true"></i>
    <span class="sidebar-brand-text">Bibliothèque</span>
  </a>
  <nav class="sidebar-nav" aria-label="Navigation principale">
    <ul class="sidebar-list">
      <li class="sidebar-item">
        <a class="sidebar-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="onNavigate()" [title]="collapsed ? 'Dashboard' : ''">
          <i class="fas fa-gauge-high" aria-hidden="true"></i>
          <span>Dashboard</span>
        </a>
      </li>

      @if (isLoggedIn() && isAdmin()) {
        <li class="sidebar-section-label">Administration</li>
        <li class="sidebar-item">
          <a class="sidebar-link" routerLink="/books" routerLinkActive="active" (click)="onNavigate()" [title]="collapsed ? 'Livres' : ''">
            <i class="fas fa-book" aria-hidden="true"></i>
            <span>Livres</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a class="sidebar-link" routerLink="/users" routerLinkActive="active" (click)="onNavigate()" [title]="collapsed ? 'Utilisateurs' : ''">
            <i class="fas fa-users" aria-hidden="true"></i>
            <span>Utilisateurs</span>
          </a>
        </li>
      }

      @if (isLoggedIn()) {
        <li class="sidebar-section-label">Bibliothèque</li>
        <li class="sidebar-item">
          <a class="sidebar-link" routerLink="/borrow" routerLinkActive="active" (click)="onNavigate()" [title]="collapsed ? 'Emprunter' : ''">
            <i class="fas fa-hand-holding-heart" aria-hidden="true"></i>
            <span>Emprunter</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a class="sidebar-link" routerLink="/borrow/return" routerLinkActive="active" (click)="onNavigate()" [title]="collapsed ? 'Rendre' : ''">
            <i class="fas fa-undo-alt" aria-hidden="true"></i>
            <span>Rendre</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a class="sidebar-link" routerLink="/reservations" routerLinkActive="active" (click)="onNavigate()" [title]="collapsed ? 'Réservations' : ''">
            <i class="fas fa-calendar-check" aria-hidden="true"></i>
            <span>Réservations</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>

@if (isOpen) {
  <button class="sidebar-backdrop" type="button" aria-label="Fermer le menu" (click)="onNavigate()"></button>
}
