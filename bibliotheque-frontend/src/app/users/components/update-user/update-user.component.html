<main class="page-shell">
  <section class="form-card">
    <div class="card-header">
      <h3 class="mb-0"><i class="fas fa-user-edit" aria-hidden="true"></i> Modifier l'utilisateur</h3>
    </div>

    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label" for="name"><i class="fas fa-user" aria-hidden="true"></i> Nom</label>
          <input type="text" class="form-control" id="name" [(ngModel)]="user.name" name="name">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="username"><i class="fas fa-at" aria-hidden="true"></i> Username</label>
          <input type="text" class="form-control" id="username" [(ngModel)]="user.username" name="username">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label" for="role"><i class="fas fa-user-tag" aria-hidden="true"></i> Rôle</label>
          <select class="form-select" id="role" [(ngModel)]="user.role[0].roleName" name="role">
            <option value="Admin">Admin</option>
            <option value="User">User</option>
          </select>
        </div>
      </div>

      <div class="action-group mt-3">
        <button class="btn btn-success" type="submit"><i class="fas fa-save" aria-hidden="true"></i> Mettre à jour</button>
        <a class="btn btn-primary" routerLink="/users"><i class="fas fa-arrow-left" aria-hidden="true"></i> Retour</a>
      </div>
    </form>
  </section>
</main>
