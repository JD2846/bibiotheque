<nav class="app-navbar">
  <button
    class="menu-toggle"
    type="button"
    (click)="onMenuToggle()"
    aria-label="Ouvrir/fermer le menu de navigation">
    <i class="fas fa-bars" aria-hidden="true"></i>
  </button>

  <a class="navbar-brand" routerLink="/home">
    <i class="fas fa-book-open brand-icon" aria-hidden="true"></i>
    <span class="brand-text">Bibliothèque</span>
  </a>

  <div class="navbar-spacer"></div>

  @if (!isLoggedIn()) {
    <a class="profile-link" routerLink="/login">
      <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
      <span>Connexion</span>
    </a>
  }

  @if (isLoggedIn()) {
    <div class="dropdown profile-dropdown">
      <button class="profile-button" type="button" (click)="toggleDropdown($event)">
        <span class="profile-avatar">{{ getUserInitial() }}</span>
        <span class="profile-name">{{ getUserName() }}</span>
        <i class="fas fa-chevron-down profile-caret" aria-hidden="true"></i>
      </button>
      <div class="dropdown-menu dropdown-menu-end" [ngClass]="{ show: isDropdownOpen }">
        <button class="dropdown-item text-danger" type="button" (click)="logout()">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
          <span>Déconnexion</span>
        </button>
      </div>
    </div>
  }
</nav>
