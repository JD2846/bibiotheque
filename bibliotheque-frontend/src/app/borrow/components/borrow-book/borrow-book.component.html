<main class="page-shell">
  <div class="page-header">
    <h2 class="page-title"><i class="fas fa-hand-holding-heart" aria-hidden="true"></i> Emprunter un livre</h2>
    <p class="page-subtitle">Choisissez un ouvrage disponible dans la bibliothèque.</p>
  </div>

  <div *ngIf="loading" class="alert alert-info d-flex align-items-center gap-2">
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    Traitement de l'emprunt...
  </div>
  <div *ngIf="error" class="alert alert-danger"><i class="fas fa-exclamation-circle" aria-hidden="true"></i> {{ error }}</div>
  <div *ngIf="success" class="alert alert-success"><i class="fas fa-check-circle" aria-hidden="true"></i> {{ success }}</div>
  <div *ngIf="!loading && !error && books.length === 0" class="empty-state">
    <i class="fas fa-book empty-icon" aria-hidden="true"></i>
    Aucun livre disponible.
  </div>

  <div *ngIf="books.length > 0" class="table-container">
    <table class="table table-striped responsive-table-card">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Auteur</th>
          <th>Genre</th>
          <th>Copies</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of books">
          <td data-label="ID">{{ book.bookId }}</td>
          <td data-label="Nom">{{ book.bookName }}</td>
          <td data-label="Auteur">{{ book.bookAuthor }}</td>
          <td data-label="Genre">{{ book.bookGenre }}</td>
          <td data-label="Copies"><span class="badge badge-info">{{ book.noOfCopies }}</span></td>
          <td data-label="Action">
            <button (click)="borrowBook(book.bookId)" class="btn btn-success btn-sm" [disabled]="loading">
              <i class="fas fa-hand-holding-heart" aria-hidden="true"></i> Emprunter
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
